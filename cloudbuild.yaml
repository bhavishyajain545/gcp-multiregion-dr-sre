# Cloud Build: test + build + push the ledger-api image (used by deploy.sh; CI does the same keylessly).
steps:
  - name: golang:1.24-bookworm
    dir: app
    entrypoint: bash
    args: ["-c", "go vet ./... && go test -count=1 ./..."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "VERSION=${_TAG}", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/apps/ledger-api:${_TAG}", "app"]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/apps/ledger-api:${_TAG}"]
images: ["${_REGION}-docker.pkg.dev/${PROJECT_ID}/apps/ledger-api:${_TAG}"]
substitutions:
  _TAG: v1
  _REGION: us-east4
options:
  logging: CLOUD_LOGGING_ONLY
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/sa-build@${PROJECT_ID}.iam.gserviceaccount.com
